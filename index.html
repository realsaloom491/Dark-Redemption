<!DOCTYPE html>
<html>
<head>
<title>ChatGPT Tok</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial;
}
header {
  padding: 18px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  background: #111;
}
header span {
  color: #00e5a0;
}
.feed {
  height: 85vh;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
}
.post {
  height: 85vh;
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #151515;
  border-bottom: 2px solid #333;
}
.post h1 {
  font-size: 35px;
}
.post p {
  color: #aaa;
}
.like {
  background: #00e5a0;
  border: none;
  padding: 12px 25px;
  border-radius: 25px;
  font-size: 17px;
  cursor: pointer;
}
nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 18px;
  background: #111;
  display: flex;
  justify-content: space-around;
}
nav a {
  color: white;
  text-decoration: none;
}
</style>
</head>
